name: All laboratories quality gate

on:
  push:
    paths: ["backend/**", "frontend/**", "scripts/**", "sro10/**", "pyproject.toml", "conftest.py", "requirements-dev.txt", "package*.json", ".github/workflows/labs.yml"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements*.txt
            sro10/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install browser tools
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build, analyze, test and enforce 85 percent coverage
        run: npm run check
      - name: Browser regression
        run: npm run lab10
      - name: Upload test, coverage, browser and demonstration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-quality-results
          path: |
            backend/lab*/results/
            sro10/results/
            test-results/
            dist/
          retention-days: 14
