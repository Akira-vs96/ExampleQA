name: SRO7 tests

on:
  push:
    paths:
      - "sro7/**"
      - ".github/workflows/sro7.yml"
  pull_request:
    paths:
      - "sro7/**"
      - ".github/workflows/sro7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run SRO7 tests
        run: python -m unittest discover -s sro7 -p "test_*.py" -v
